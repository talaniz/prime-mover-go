---
- name: Provision Prime Mover Temporal development VM
  hosts: all
  become: true
  vars:
    temporal_version: "1.25.2"
    temporal_ui_version: "2.31.2"
    postgres_version: "16"
    docker_dns_servers:
      - "1.1.1.1"
      - "8.8.8.8"

  tasks:
    - name: Install base development packages
      ansible.builtin.apt:
        update_cache: true
        name:
          - ca-certificates
          - curl
          - docker.io
          - git
          - golang-go
          - make
        state: present

    - name: Install Docker Compose plugin
      ansible.builtin.apt:
        name: docker-compose-plugin
        state: present
      register: compose_plugin
      ignore_errors: true

    - name: Install legacy Docker Compose package when plugin is unavailable
      ansible.builtin.apt:
        name: docker-compose
        state: present
      when: compose_plugin is failed

    - name: Create Docker config directory
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: "0755"

    - name: Configure Docker DNS
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: |
          {
            "dns": {{ docker_dns_servers | to_json }}
          }

    - name: Enable and restart Docker
      ansible.builtin.service:
        name: docker
        enabled: true
        state: restarted

    - name: Allow vagrant user to run Docker
      ansible.builtin.user:
        name: vagrant
        groups: docker
        append: true

    - name: Create Temporal directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /opt/temporal/dynamicconfig
        - /opt/temporal/data/postgres

    - name: Configure Temporal dynamic config
      ansible.builtin.copy:
        dest: /opt/temporal/dynamicconfig/development-sql.yaml
        mode: "0644"
        content: |
          system.forceSearchAttributesCacheRefreshOnRead:
            - value: true
              constraints: {}

    - name: Write Temporal Docker Compose file
      ansible.builtin.copy:
        dest: /opt/temporal/docker-compose.yml
        mode: "0644"
        content: |
          services:
            postgresql:
              image: postgres:{{ postgres_version }}
              container_name: temporal-postgresql
              environment:
                POSTGRES_USER: temporal
                POSTGRES_PASSWORD: temporal
                POSTGRES_DB: temporal
              volumes:
                - /opt/temporal/data/postgres:/var/lib/postgresql/data
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U temporal"]
                interval: 10s
                timeout: 5s
                retries: 10

            temporal:
              image: temporalio/auto-setup:{{ temporal_version }}
              container_name: temporal
              depends_on:
                postgresql:
                  condition: service_healthy
              environment:
                DB: postgres12
                DB_PORT: "5432"
                POSTGRES_USER: temporal
                POSTGRES_PWD: temporal
                POSTGRES_SEEDS: postgresql
                DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
                TEMPORAL_ADDRESS: 0.0.0.0:7233
              ports:
                - "7233:7233"
              volumes:
                - /opt/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig

            temporal-ui:
              image: temporalio/ui:{{ temporal_ui_version }}
              container_name: temporal-ui
              depends_on:
                - temporal
              environment:
                TEMPORAL_ADDRESS: temporal:7233
                TEMPORAL_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
              ports:
                - "8233:8080"

    - name: Install temporal-compose helper
      ansible.builtin.copy:
        dest: /usr/local/bin/temporal-compose
        mode: "0755"
        content: |
          #!/usr/bin/env sh
          set -eu
          if docker compose version >/dev/null 2>&1; then
            exec docker compose -f /opt/temporal/docker-compose.yml "$@"
          fi
          exec docker-compose -f /opt/temporal/docker-compose.yml "$@"

    - name: Configure shell environment for Temporal
      ansible.builtin.copy:
        dest: /etc/profile.d/prime-mover-temporal.sh
        mode: "0644"
        content: |
          export TEMPORAL_ADDRESS=127.0.0.1:7233

    - name: Start Temporal stack
      ansible.builtin.command: temporal-compose up -d
      register: temporal_stack
      retries: 5
      delay: 20
      until: temporal_stack.rc == 0
      changed_when: true
